[project]
name = "app"
version = "0.1.0"
description = "PROJECT_NAME"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    # Was already an indirect dependency via `anthropic`; made explicit for app.search (the
    # Tavily backend), which needs its bundled CA store rather than urllib's OS-keychain default.
    "httpx>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    # scripts/devserver.py only - a local, manual latency/cost feel-test tool, not used by the
    # app, the eval harness, or CI. Lives in the dev group so `make install` (`uv sync`) still
    # picks it up without adding a runtime dependency the shipped pipeline doesn't need.
    "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "evals", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
