# Starting points, not standards. Tune per project, and change only in dedicated commits.
# v0: latency raised 2s -> 60s (uninformed pre-run guess), then 60s -> 300s after a real
# eval-fast run measured p95 = 240s: search-heavy statistical_data/provenance_only claims can
# need several searches, each round-tripping through the model at effort=medium.
min_pass_rate: 0.90
max_latency_p95_s: 300.0
max_mean_cost_usd: 0.10
# Bounds this run's TOTAL spend across every case, on top of Config.max_cost_usd (which only
# bounds one case at a time). Sized for the 13-case fast tier: the last two live runs cost about
# $1.08 each, so $2.50 leaves room for a heavier-than-usual run while still catching a runaway one.
# It is a single number for every tier, so it would need raising (or per-tier values) before
# eval-standard's ~50 cases are ever run for real. A CI-time backstop only - the $20/month Console
# limit remains the account-level guard.
max_total_cost_usd: 2.50
