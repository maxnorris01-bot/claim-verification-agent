name: ci

on:
  pull_request:
  push:
    branches: [main]

# CI never calls the real Anthropic API. Every job here runs against the mock client (free, no key
# needed), so it checks routing, schemas, tracing and budgets - not answer quality. Live evals are
# run deliberately from a developer machine (`make eval-fast-live`). ANTHROPIC_API_KEY is
# intentionally NOT passed to any job: if something here were ever switched to live mode by mistake,
# it would fail instead of spending money. (The template's daily scheduled `eval-nightly` job was
# removed on 2026-09-26 for the same reason - it ran the same mock cases and told us almost
# nothing.)
env:
  APP_LLM_MODE: mock

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: make lint
      - run: make typecheck
      - run: make test

  eval-fast:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: make eval-fast

  eval-standard:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: make eval-standard
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
